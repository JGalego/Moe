[package]
name = "moe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Compact CPU inference engine for sparse mixture-of-experts language models"
license = "MIT"

[[bin]]
name = "moe"
path = "src/main.rs"

[lib]
name = "moe"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
