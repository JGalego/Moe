[package]
# The binary and the library are both `moe`; the registry slug carries the
# tagline because `moe` alone was already taken.
name = "moe-ontap"
version = "0.1.0"
edition = "2021"
# 1.85 is the floor its dependencies impose, not a preference: ureq requires
# 1.85 and rayon 1.80, and 1.84's cargo cannot parse edition2024 manifests.
# The `msrv` CI job pins this exact version so the claim cannot rot.
rust-version = "1.85"
description = "Compact CPU inference engine for sparse mixture-of-experts language models"
license = "MIT"
repository = "https://github.com/JGalego/Moe"
homepage = "https://github.com/JGalego/Moe"
readme = "README.md"
keywords = ["llm", "inference", "mixture-of-experts", "moe", "cpu"]
categories = ["command-line-utilities", "science"]

# The fuzz targets need nightly and cargo-fuzz, so they stay out of the
# workspace and `cargo test` never tries to build them.
[workspace]
members = []
exclude = ["fuzz"]

[[bin]]
name = "moe"
path = "src/main.rs"

[lib]
name = "moe"
path = "src/lib.rs"

[features]
default = ["fetch"]
# Downloading models from URLs and the Hugging Face Hub. Turn it off for a
# build with no TLS stack: `cargo build --no-default-features`.
fetch = ["dep:ureq"]

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
