[package]
name = "moe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Compact CPU inference engine for sparse mixture-of-experts language models"
license = "MIT"

[[bin]]
name = "moe"
path = "src/main.rs"

[lib]
name = "moe"
path = "src/lib.rs"

[features]
default = ["fetch"]
# Downloading models from URLs and the Hugging Face Hub. Turn it off for a
# build with no TLS stack: `cargo build --no-default-features`.
fetch = ["dep:ureq"]

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
