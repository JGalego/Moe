<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Moe — every expert on tap">
  <title>Moe</title>
  <desc>A neon bar sign reading MoE, beside a router fanning out to eight experts with two lit.</desc>

  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spark" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161f"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
  </defs>

  <!-- sign panel -->
  <rect x="8" y="8" width="624" height="204" rx="22" fill="url(#panel)"/>
  <rect x="8.75" y="8.75" width="622.5" height="202.5" rx="21.25" fill="none" stroke="#ffb02e" stroke-opacity="0.38" stroke-width="1.5"/>
  <rect x="20" y="20" width="600" height="180" rx="14" fill="none" stroke="#ffb02e" stroke-opacity="0.10" stroke-width="1"/>

  <!-- wordmark -->
  <g font-family="'Trebuchet MS','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="196" y="122" text-anchor="middle" font-size="94" font-weight="700"
          fill="#ffd479" filter="url(#neon)" letter-spacing="-2">MoE</text>
    <text x="196" y="164" text-anchor="middle" font-size="14.5" font-weight="600"
          fill="#8b95a6" letter-spacing="4.4">EVERY EXPERT ON TAP</text>
  </g>

  <!-- divider -->
  <line x1="350" y1="46" x2="350" y2="174" stroke="#222a38" stroke-width="1.5"/>

  <!-- routing: one token, eight experts, two chosen -->
  <g fill="none" stroke="#273142" stroke-width="2">
    <path d="M408 110 L568 40"/>
    <path d="M408 110 L568 60"/>
    <path d="M408 110 L568 100"/>
    <path d="M408 110 L568 120"/>
    <path d="M408 110 L568 160"/>
    <path d="M408 110 L568 180"/>
  </g>
  <g fill="none" stroke="#3ee0d0" stroke-width="2.6" filter="url(#spark)">
    <path d="M408 110 L568 80"/>
    <path d="M408 110 L568 140"/>
  </g>

  <circle cx="400" cy="110" r="7.5" fill="#ffd479" filter="url(#spark)"/>

  <g>
    <circle cx="576" cy="40" r="6" fill="#161c27" stroke="#2c3648" stroke-width="1.5"/>
    <circle cx="576" cy="60" r="6" fill="#161c27" stroke="#2c3648" stroke-width="1.5"/>
    <circle cx="576" cy="80" r="7" fill="#3ee0d0" filter="url(#spark)"/>
    <circle cx="576" cy="100" r="6" fill="#161c27" stroke="#2c3648" stroke-width="1.5"/>
    <circle cx="576" cy="120" r="6" fill="#161c27" stroke="#2c3648" stroke-width="1.5"/>
    <circle cx="576" cy="140" r="7" fill="#3ee0d0" filter="url(#spark)"/>
    <circle cx="576" cy="160" r="6" fill="#161c27" stroke="#2c3648" stroke-width="1.5"/>
    <circle cx="576" cy="180" r="6" fill="#161c27" stroke="#2c3648" stroke-width="1.5"/>
  </g>

  <text x="470" y="196" text-anchor="middle" font-size="11.5" font-weight="600"
        font-family="'Trebuchet MS','Helvetica Neue',Helvetica,Arial,sans-serif"
        fill="#5b6675" letter-spacing="2.6">TOP-2 OF 8</text>
</svg>
