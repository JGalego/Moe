name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner: the macOS SDK is universal,
          # and the macos-13 image this used to need is being retired, which
          # would leave a release queued behind a runner that never arrives.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="moe-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/moe.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/moe" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist && tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: moe-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Before download-artifact: checkout cleans the workspace, which would
      # take the artifacts with it.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      # The section the tag names, so the release reads as what was written for
      # it rather than as a list of commits. A tag with no section leaves this
      # empty and the generated notes stand alone.
      - name: notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
